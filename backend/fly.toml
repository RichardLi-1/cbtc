# fly.toml app configuration file generated for cbtc-q2xdia on 2026-05-18T16:36:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cbtc-q2xdia'
primary_region = 'ams'

[build]

[env]
  ML_API_BASE = 'https://cbtc-8hizug.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  # One machine only: the sim is in-memory. A second replica is a second
  # universe — clients bounce between them and the UI flickers.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
