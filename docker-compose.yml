# Full stack: sim backend + ML API + static frontend (nginx).
services:
  backend:
    build: ./backend
    ports:
      - "8000:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  ml:
    build: ./ml
    ports:
      - "8001:8001"
    environment:
      RLCBTC_POLICY_PATH: /app/models/deployed/ppo_baseline/policy.zip
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ml/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - ml
